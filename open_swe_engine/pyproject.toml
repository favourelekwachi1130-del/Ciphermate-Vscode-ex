[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ciphermate-open-swe-engine"
version = "0.1.0"
description = "Open SWE–style agentic code generation and fixing for CipherMate (workspace-backed, no sandbox)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["open_swe_engine"]
