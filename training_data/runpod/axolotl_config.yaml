# Scripter fine-tuning config for RunPod
# Docs: https://github.com/OpenAccess-AI-Collective/axolotl
# Run: axolotl launch axolotl_config.yaml

base_model: meta-llama/Meta-Llama-3.2-3B-Instruct-Turbo
model_type: LlamaForCausalLM

datasets:
  - path: /Users/manny/Downloads/Ciphermate-Vscode-ex-main 3 copy/training_data/scripter_mini.jsonl
    type: alpaca
    dataset: messages  # JSONL with "messages" field

lora_r: 16
lora_alpha: 32
num_epochs: 3
micro_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 2e-5
output_dir: /Users/manny/Downloads/Ciphermate-Vscode-ex-main 3 copy/training_data/runpod/scripter-lora

# RunPod: Use A100 40GB or similar
